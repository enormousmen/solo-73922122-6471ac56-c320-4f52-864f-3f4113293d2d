<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>静默规则首呼预演</title>
<style>
  :root {
    --bg: #0f1420; --panel: #181f2e; --panel2: #1f2839; --line: #2b3650;
    --text: #e6ebf5; --muted: #93a0b8; --accent: #4f8cff;
    --ok: #3fb96b; --warn: #e0a93b; --bad: #e5534b; --neutral: #7d8aa3;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--text); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--muted); font-size:13px; }
  main { padding:20px 24px 60px; max-width:1280px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:980px){ .grid{grid-template-columns:1fr;} }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .card h2 .tag { font-weight:400; font-size:12px; color:var(--muted); }
  textarea { width:100%; min-height:220px; resize:vertical; background:#0c111c; color:var(--text);
             border:1px solid var(--line); border-radius:8px; padding:10px;
             font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .params { display:flex; gap:14px; flex-wrap:wrap; align-items:end; margin-top:14px; }
  .params label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .params input { background:#0c111c; color:var(--text); border:1px solid var(--line);
                  border-radius:8px; padding:8px 10px; font-size:13px; width:230px; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:16px 0; }
  button { border:1px solid var(--line); background:var(--panel2); color:var(--text);
           border-radius:8px; padding:9px 18px; cursor:pointer; font-size:14px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.6; cursor:progress; }
  button:hover:not(:disabled) { filter:brightness(1.12); }
  .hint { color:var(--muted); font-size:12px; margin:6px 0 0; }
  #error { display:none; background:#3a1d20; border:1px solid var(--bad); color:#ffb4b0;
           padding:10px 14px; border-radius:8px; margin-bottom:14px; white-space:pre-wrap; }
  #status { display:none; color:var(--warn); font-size:13px; margin-bottom:12px; }
  #status.on { display:block; }
  .summary { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .pill { background:var(--panel2); border:1px solid var(--line); border-radius:999px;
          padding:6px 14px; font-size:13px; }
  .pill b { font-size:15px; margin-left:4px; }
  .pill.hot { border-color:#5a4218; }
  .legend { color:var(--muted); font-size:12px; margin:6px 0 14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { border-bottom:1px solid var(--line); padding:9px 10px; text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  tr.row-still td { color:var(--muted); }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; white-space:nowrap; }
  .v-delayed   { background:#3a2f12; color:var(--warn); }
  .v-suppressed{ background:#3a1d20; color:var(--bad); }
  .v-unchanged { background:#16301f; color:var(--ok); }
  .v-earlier, .v-newly_called { background:#14283d; color:var(--accent); }
  .v-still_not_called { background:#262c38; color:var(--neutral); }
  .notcalled { color:var(--bad); font-weight:600; }
  .waiting-note { color:var(--warn); font-size:12px; display:block; margin-top:2px; }
  .alerts-cell { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  details.detail { margin-top:6px; }
  details.detail > summary { cursor:pointer; color:var(--accent); font-size:12px; }
  .stretch { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); }
  .detail-body { padding:6px 0 2px 8px; border-left:2px solid var(--line); margin-top:4px; }
  .detail-body h4 { margin:8px 0 4px; font-size:12px; color:var(--muted); }
  .detail-msg { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); padding:24px; text-align:center; }
  code { background:#0c111c; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>静默规则首呼预演</h1>
  <span class="sub">同一服务未静默活动告警不断则首呼等待连续计时 · 断档重新等待 · 每轮故障只首呼一次</span>
</header>
<main>
  <div class="grid">
    <section class="card">
      <h2>① 告警导入 <span class="tag">JSON 数组；recovered_at 可留 null</span></h2>
      <textarea id="alerts" spellcheck="false"></textarea>
      <p class="hint">字段：id / service / labels（对象）/ fired_at / recovered_at，时间用 ISO-8601（推荐带 Z 时区）。
        也可 <label style="color:var(--accent);cursor:pointer">选择文件导入<input type="file" id="alertFile" accept=".json,application/json" hidden></label></p>
    </section>
    <section class="card">
      <h2>② 现行静默规则 <span class="tag">全标签匹配，区间 [start_at, end_at)</span></h2>
      <textarea id="current" spellcheck="false"></textarea>
      <h2 style="margin-top:14px">③ 拟新增静默规则</h2>
      <textarea id="proposed" spellcheck="false"></textarea>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <h2>④ 计时参数</h2>
    <div class="params">
      <label>首呼等待时长（分钟，&gt;0）
        <input id="wait" type="number" step="0.5" min="0.1" value="10" />
      </label>
      <label>观察截止时间
        <input id="cutoff" type="text" value="2026-11-21T12:00:00Z" />
      </label>
    </div>
    <div class="btns">
      <button class="primary" id="run">运行预演</button>
      <button id="loadSample">重置并载入样例</button>
    </div>
    <p class="hint">同刻变化先一并生效再判定；观察截止时刻本身不再触发首呼（含恰好凑满等待的情形）。
      预演成功后才会换表；等待或失败期间，旧表仍可展开明细。</p>
  </section>

  <div id="error"></div>
  <div id="status"></div>
  <div id="results" style="margin-top:18px"></div>
</main>

<script type="module" src="/static/app.mjs"></script>
</body>
</html>
